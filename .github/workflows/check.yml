name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve and smoke-test site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for path in / /notes/ /projects/ /style.css; do
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 "http://127.0.0.1:8080$path" -o /dev/null
          done
      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --root-dir '${{ github.workspace }}' --index-files index.html './**/*.html'
          fail: true
